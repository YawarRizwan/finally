# Integration test stack. Runs the production image with the simulator + LLM
# mock, then drives it with Playwright.
#
# Usage:
#   docker compose -f test/docker-compose.test.yml up --build \
#     --abort-on-container-exit --exit-code-from playwright
#
# The Playwright container exit code propagates as the run's exit code.

name: finally-test

services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: finally:test
    container_name: finally-test-app
    environment:
      # Deterministic LLM output via the pinned fixture.
      LLM_MOCK: "true"
      # Explicitly empty: forces the simulator for reproducible prices.
      MASSIVE_API_KEY: ""
      # Keep OPENROUTER_API_KEY unset — LLM_MOCK=true means it is not used.
      OPENROUTER_API_KEY: "test-placeholder-not-used"
      PORTFOLIO_SNAPSHOT_INTERVAL_SECONDS: "5"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8000/api/health"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s
    networks:
      - finally-test

  playwright:
    # Pin to a current stable Playwright image. The tag matches the @playwright/test
    # version in test/package.json so the browser binaries line up with the runner.
    image: mcr.microsoft.com/playwright:v1.49.0-jammy
    container_name: finally-test-playwright
    depends_on:
      app:
        condition: service_healthy
    environment:
      APP_BASE_URL: "http://app:8000"
      CI: "true"
    working_dir: /tests
    volumes:
      - ./:/tests
    # Install deps against the mounted workspace, then run the suite. The
    # container's exit code (propagated by --exit-code-from playwright) is
    # the suite's exit code.
    command: ["sh", "-c", "npm ci && npx playwright test"]
    networks:
      - finally-test

networks:
  finally-test:
    driver: bridge
